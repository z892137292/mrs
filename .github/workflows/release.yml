name: Publish the verified amd64 image
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: verified-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the successful verification of this exact source
        id: proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          candidate="$GITHUB_SHA"
          if git rev-parse HEAD^2 >/dev/null 2>&1; then candidate="$(git rev-parse HEAD^2)"; fi
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$candidate&status=success" --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the tested image and verification records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: amd64-image-and-test-records
          run-id: ${{ steps.proof.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: verified
      - name: Verify proof and load the exact tested image
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = "$(cat verified/tested-source-tree.txt)"
          test -s verified/container-result.txt
          jq -e '.uid != 0 and .seconds >= 3600 and .cycles >= 3' verified/chromium-soak.json
          (cd verified && sha256sum -c mrs-custom-amd64.tar.gz.sha256)
          gzip -dc verified/mrs-custom-amd64.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' mrs-custom:ci)" = "$(cat verified/tested-image-id.txt)"
          test "$(docker image inspect --format '{{.Architecture}}' mrs-custom:ci)" = amd64
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' mrs-custom:ci)" = "$version"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish without rebuilding or overwriting an existing version
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microsoft-rewards-custom:$(cat VERSION)"
          if message="$(docker manifest inspect "$image" 2>&1)"; then
            echo 'Release version already exists; refusing overwrite' >&2; exit 1
          elif ! grep -Eqi 'manifest unknown|no such manifest|not found' <<<"$message"; then
            echo 'Cannot determine release tag state; refusing publication' >&2; exit 1
          fi
          docker tag mrs-custom:ci "$image"
          docker push "$image" | tee verified/publish.log
          docker image inspect --format '{{json .RepoDigests}}' "$image" > verified/published-digests.json
          printf 'Published %s\nVerification run: https://github.com/%s/actions/runs/%s\n' "$image" "$GITHUB_REPOSITORY" '${{ steps.proof.outputs.run_id }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve publication records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-publication-records
          path: |
            verified/publish.log
            verified/published-digests.json
          if-no-files-found: warn
