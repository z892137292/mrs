name: Web admin real build and candidate release
on:
  push:
    branches: [feature/web-admin-notifications]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Shell and Docker static checks
        run: |
          shellcheck -x -P SCRIPTDIR/.. docker/*.sh scripts/*.sh tests/*.sh
          docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.14.0 < admin/Dockerfile
      - name: Install and test real HTTP/SMTP APIs
        working-directory: admin
        env:
          CI: 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
          npm test
      - name: Existing wrapper and data regression
        run: |
          bash tests/run-wrapper.test.sh
          bash tests/repeat-wrapper.test.sh
          bash tests/backup-restore.test.sh
      - name: Fixed upstream patch regression
        run: bash tests/patch-check.sh
  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Version
        id: version
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build rewards amd64 once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mrs-custom:web-ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web-rewards
          cache-to: type=gha,scope=web-rewards,mode=max
      - name: Build Web amd64 once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: admin/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: mrs-web:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web-ui
          cache-to: type=gha,scope=web-ui,mode=max
      - name: Original real Chromium and lifecycle regression
        env:
          SOAK_SECONDS: '120'
        run: bash tests/container.test.sh mrs-custom:web-ci test-results/core
      - name: Real two-container Web and Chromium UI tests
        run: bash tests/web-container.test.sh mrs-custom:web-ci mrs-web:ci test-results/web
      - name: Capture tested identities
        run: |
          docker image inspect --format '{{.Id}}' mrs-custom:web-ci > test-results/rewards-image-id.txt
          docker image inspect --format '{{.Id}}' mrs-web:ci > test-results/web-image-id.txt
          git rev-parse HEAD > test-results/commit.txt
          git rev-parse 'HEAD^{tree}' > test-results/source-tree.txt
      - name: Save actual test records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-admin-actual-test-records
          path: test-results/
          retention-days: 30
      - name: Login only after all critical tests
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested candidate pair without overwriting
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test -s test-results/core/container-result.txt
          test -s test-results/web/result.txt
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="$(cat VERSION)"
          docker buildx imagetools inspect "ghcr.io/$owner/microsoft-rewards-custom:1.0.3" > test-results/stable-image-state.txt
          grep -Eq '^Digest:[[:space:]]+sha256:8245f6737d68c4e09a84b7988ecee343a038a101e108fb9d34ee4f5f49b34089' test-results/stable-image-state.txt
          targets=("ghcr.io/$owner/microsoft-rewards-custom:$version" "ghcr.io/$owner/microsoft-rewards-web-admin:$version")
          # Validate BOTH target tags before any push. Unknown authorization/registry errors refuse publication.
          for target in "${targets[@]}"; do
            if message="$(docker manifest inspect "$target" 2>&1)"; then
              echo 'Candidate version already exists; refusing overwrite' >&2; exit 1
            elif ! grep -Eqi 'manifest unknown|no such manifest|not found' <<<"$message"; then
              echo 'Registry tag state unknown; refusing publication' >&2; exit 1
            fi
          done
          test "$(docker image inspect --format '{{.Id}}' mrs-custom:web-ci)" = "$(cat test-results/rewards-image-id.txt)"
          test "$(docker image inspect --format '{{.Id}}' mrs-web:ci)" = "$(cat test-results/web-image-id.txt)"
          docker tag mrs-custom:web-ci "${targets[0]}"
          docker tag mrs-web:ci "${targets[1]}"
          docker push "${targets[0]}" | tee test-results/rewards-publish.log
          docker push "${targets[1]}" | tee test-results/web-publish.log
          docker image inspect --format '{{json .RepoDigests}}' "${targets[0]}" > test-results/rewards-digest.json
          docker image inspect --format '{{json .RepoDigests}}' "${targets[1]}" > test-results/web-digest.json
      - name: Save publication records
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-admin-candidate-publication
          path: |
            test-results/*-digest.json
            test-results/*-publish.log
            test-results/stable-image-state.txt
          if-no-files-found: warn
