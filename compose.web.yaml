name: mrs-web-candidate
services:
  rewards:
    image: ${REWARDS_IMAGE:-ghcr.io/z892137292/microsoft-rewards-custom:1.1.0-rc.3}
    platform: linux/amd64
    restart: unless-stopped
    env_file: [.env]
    environment:
      CONTROL_API_ENABLED: "true"
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Generate a private control token}
      CONTROL_DATA_DIR: /usr/src/microsoft-rewards-script/control-data
      RUN_ON_START: "false"
    volumes:
      - ${REWARDS_DATA_ROOT:-./web-candidate-data}/config:/usr/src/microsoft-rewards-script/config
      - ${REWARDS_DATA_ROOT:-./web-candidate-data}/sessions:/usr/src/microsoft-rewards-script/sessions
      - ${REWARDS_DATA_ROOT:-./web-candidate-data}/state:/usr/src/microsoft-rewards-script/state
      - ${REWARDS_DATA_ROOT:-./web-candidate-data}/logs:/usr/src/microsoft-rewards-script/logs
      - ${REWARDS_DATA_ROOT:-./web-candidate-data}/diagnostics:/usr/src/microsoft-rewards-script/diagnostics
      - control-data:/usr/src/microsoft-rewards-script/control-data
    shm_size: 1gb
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    networks: [control, rewards-egress]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    image: ${WEB_IMAGE:-ghcr.io/z892137292/microsoft-rewards-web-admin:1.1.0-rc.3}
    platform: linux/amd64
    restart: unless-stopped
    # Only the Web service's own credentials; no ACCOUNT_*, config or sessions mounts.
    environment:
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Generate a private control token}
      CONTROL_URL: http://rewards:8090
      WEB_BOOTSTRAP_TOKEN: ${WEB_BOOTSTRAP_TOKEN:?Generate a private bootstrap token}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:8088}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-false}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_HOST_PORT:-8088}:8080"
    volumes: [web-data:/data]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    networks: [control, web-egress]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  control-data:
  web-data:
networks:
  control:
    internal: true
  rewards-egress:
  web-egress:
